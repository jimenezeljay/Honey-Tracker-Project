<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Honey Tracker</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Leaflet map library (OpenStreetMap) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

  <!-- Compiled CSS (already includes Bootstrap) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Navbar and footer are built by js/components.js (edit them there, once) -->
  <div data-component="site-nav"></div>

  <main class="container home-hero">
    <div class="home-grid">
      <div class="home-copy">
        <h1 class="mb-4">Honey you can trust.</h1>
        <p class="lead mb-4">We trace every jar back to its hive.</p>
        <!-- Opens the jar-code pop-up below. Without JavaScript it falls back to find-your-honey.html -->
        <a class="btn btn-primary btn-lg" href="find-your-honey.html" data-bs-toggle="modal" data-bs-target="#findHoneyModal">Find your honey</a>
      </div>

      <div class="home-map">
        <!-- Real map (js/home.js + js/maps.js). One dot per hive (or one rounded
             dot for keepers who keep their spot private). Search opens the Map page: map.html?q=... -->
        <div class="map-box home-map__box">
          <div class="home-map__canvas" id="homeMap" aria-label="Map of certified hives"></div>
          <form class="map-search search-pill search-pill--sm" role="search" action="map.html" method="get">
            <label class="visually-hidden" for="mapSearch">Search this map</label>
            <i class="bi bi-search" aria-hidden="true"></i>
            <input class="form-control" id="mapSearch" name="q" type="search" placeholder="Search this map">
          </form>
          <div class="map-legend">
            <span><i class="key-pin"></i>Hive</span>
            <span class="map-legend__note">Locations may not be exact</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Find your honey pop-up (homepage button). Same form and script as find-your-honey.html,
       which stays as the full page (footer "Trace a jar" link, and the fallback without JavaScript). -->
  <div class="modal fade" id="findHoneyModal" tabindex="-1" aria-labelledby="findHoneyTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content find-modal">
        <div class="modal-header">
          <h2 class="modal-title" id="findHoneyTitle">Find your honey</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="text-soft mb-3">Bought a jar elsewhere? Type the code under its QR.</p>
          <form id="codeForm" role="search" novalidate>
              <label class="visually-hidden" for="jarCode">Jar code</label>
              <div class="search-pill search-pill--action">
                <i class="bi bi-upc-scan" aria-hidden="true"></i>
                <input class="form-control" id="jarCode" name="code" type="text" placeholder="HT-0011"
                       autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="codeError">
                <button class="btn btn-primary" type="submit">Trace it</button>
              </div>
              <div class="invalid-feedback" id="codeError" role="alert">That doesn't look like a jar code.</div>
            </form>

          <rect x="38" y="113" width="94" height="26" rx="5" fill="#FBF6EA" stroke="#E0A030" stroke-dasharray="4 3"/>
          <text x="85" y="131" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#3a2e1f">HT-0011</text>
          <text x="85" y="152" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8A9A7B">Wildflower · Spring 2026</text>
        </svg>
            <a href="learn.html#qr-tracing">How do the codes work?</a>
          </div>
        </div>
        <div class="modal-footer">
          <span class="text-soft">Shopping instead?</span>
          <a href="marketplace.html">Marketplace</a>
          <span class="text-soft" aria-hidden="true">&middot;</span>
          <a href="map.html">Map</a>
        </div>
      </div>
    </div>
  </div>

  <div data-component="site-footer"></div>

  <!-- Shared navbar + footer first (local file, so they appear without waiting on the CDN) -->
  <script src="js/components.js"></script>
  <!-- Bootstrap JS (dropdowns, tabs, offcanvas, modals). Goes at the end of body -->

  <!-- Your JS -->
  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/maps.js"></script>

</html>
