<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Honey Tracker</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Leaflet map library (OpenStreetMap) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

  <!-- Compiled CSS (already includes Bootstrap) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Navbar and footer are built by js/components.js (edit them there, once) -->
  <div data-component="site-nav"></div>

  <main class="container home-hero">
    <div class="home-grid">
      <div class="home-copy">
        <h1 class="mb-4">Honey you can trust.</h1>
        <p class="lead mb-4">We trace every jar back to its hive.</p>
        <!-- Opens the jar-code lookup (for jars bought elsewhere) -->
        <a class="btn btn-primary btn-lg" href="find-your-honey.html">Find your honey</a>
      </div>

      <div class="home-map">
        <!-- Real map (js/home.js + js/maps.js). Pin = exact hive; dashed area = a keeper who
             only shares an approximate location. Search opens the Map page: map.html?q=... -->
        <div class="map-box home-map__box">
          <div class="home-map__canvas" id="homeMap" aria-label="Map of certified hives"></div>
          <form class="map-search search-pill search-pill--sm" role="search" action="map.html" method="get">
            <label class="visually-hidden" for="mapSearch">Search this map</label>
            <i class="bi bi-search" aria-hidden="true"></i>
            <input class="form-control" id="mapSearch" name="q" type="search" placeholder="Search this map">
          </form>
          <div class="map-legend">
            <span><i class="key-pin"></i>Exact hive</span>
            <span><i class="key-area"></i>Approximate area</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div data-component="site-footer"></div>

  <!-- Shared navbar + footer first (local file, so they appear without waiting on the CDN) -->
  <script src="js/components.js"></script>
  <!-- Bootstrap JS (dropdowns, tabs, offcanvas, modals). Goes at the end of body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your JS -->
  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/data.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
