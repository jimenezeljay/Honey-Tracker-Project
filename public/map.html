<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map | Honey Tracker</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Leaflet map library (OpenStreetMap) + its clustering add-on -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

  <!-- Compiled CSS (already includes Bootstrap) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Navbar and footer are built by js/components.js (edit them there, once) -->
  <div data-component="site-nav" data-active="map"></div>

  <!-- Wireframes 2 and 3: panel on the left (search, layers, farms in view), map on the right.
       Clicking a farm opens its card. On phones: search and layers, then the map, then the list.
       Links in:  map.html?q=clover   (homepage search)
                  map.html?farm=3     (Marketplace "View on map", product page "Open in map")
       Built by js/map.js. -->
  <main class="map-page" id="mapPage">
    <header class="page-head">
      <h1 class="mb-1">Map</h1>
      <p class="text-soft mb-0">Find certified hives near you.</p>
    </header>

    <section class="map-controls" aria-label="Search and layers">
      <form class="map-controls__search" role="search" id="mapForm">
        <label class="visually-hidden" for="mapQuery">Search farms, keepers, honey or state</label>
        <div class="search-pill">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input class="form-control" id="mapQuery" name="q" type="search" placeholder="Search farms, keepers, honey" autocomplete="off">
        </div>
      </form>

      <fieldset class="map-layers">
        <legend class="map-label">Show</legend>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="layerHives" checked>
          <label class="form-check-label" for="layerHives">Hive locations</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="layerForage" checked>
          <label class="form-check-label" for="layerForage">Forage areas</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="layerCertified">
          <label class="form-check-label" for="layerCertified">Certified only</label>
        </div>
      </fieldset>
    </section>

    <div class="map-stage">
      <div class="map-stage__canvas" id="bigMap" aria-label="Map of hives"></div>

      <div class="map-legend">
        <span><i class="key-pin"></i>Exact hive</span>
        <span><i class="key-area"></i>Approximate area</span>
      </div>

      <!-- Farm card (wireframe 3), filled by js/map.js -->
      <aside class="farm-card" id="farmCard" aria-live="polite" hidden></aside>
    </div>

    <section class="map-results" aria-labelledby="resultsTitle">
      <h2 class="map-label" id="resultsTitle"><span id="resultCount">0</span> in this view</h2>
      <ul class="map-results__list" id="resultList"></ul>
      <div class="map-results__empty" id="resultEmpty" hidden>
        <p class="mb-2">Buzz kill. No farms here.</p>
        <button class="btn btn-sm btn-outline-secondary" type="button" id="showAll">Show all farms</button>
      </div>
    </section>
  </main>

  <div data-component="site-footer"></div>

  <!-- Shared navbar + footer first (local file, so they appear without waiting on the CDN) -->
  <script src="js/components.js"></script>
  <!-- Bootstrap JS (dropdowns, tabs, offcanvas, modals). Goes at the end of body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your JS -->
  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
