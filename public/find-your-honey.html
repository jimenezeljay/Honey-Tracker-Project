  <!-- For jars bought somewhere else: type the code printed under the QR (HT-0011)
       and js/find-your-honey.js opens product.html?batch=11. Scanning the QR skips this page.
       Shoppers who just want a type of honey or a place get sent to the Marketplace or Map. -->
  <main class="container find-honey">
    <div class="row align-items-center g-4 mb-5">
      <div class="col-md-7">
        <h1 class="mb-3">Find your honey</h1>
        <p class="lead mb-4">Bought a jar elsewhere? Type the code under its QR.</p>
        <form id="codeForm" role="search" novalidate>
          <label class="visually-hidden" for="jarCode">Jar code</label>
          <div class="search-pill search-pill--action">
            <i class="bi bi-upc-scan" aria-hidden="true"></i>
            <input class="form-control" id="jarCode" name="code" type="text" placeholder="HT-0011"
                   autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="codeError">
            <button class="btn btn-primary" type="submit">Trace it</button>
          </div>
          <div class="invalid-feedback" id="codeError" role="alert">That doesn't look like a jar code.</div>
        </form>
      </div>
