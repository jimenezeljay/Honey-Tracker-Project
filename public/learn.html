<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn | Honey Tracker</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Compiled CSS (already includes Bootstrap) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Navbar and footer are built by js/components.js (edit them there, once) -->
  <div data-component="site-nav" data-active="learn"></div>

  <!-- Wireframe 9 (v2): title on the left, the three tabs on the right as one white block
       with an amber highlight that slides to the open tab (js/learn.js). Content runs full width below.
       Phones: the tabs sit under the title with shorter labels so they fit.
       Pollen & allergies is left out until the allergy research (Jira HC-19) is done. -->
  <main class="container learn">
    <div class="learn-top">
      <header class="page-head">
        <h1 class="mb-1">Learn</h1>
        <p class="text-soft mb-0">What&rsquo;s in your honey, and why it matters.</p>
      </header>

      <nav class="learn-tabs" aria-label="Learn sections">
        <div class="nav" role="tablist">
          <span class="learn-tabs__thumb" aria-hidden="true"></span>
          <button class="nav-link active" id="btn-definitions" data-bs-toggle="pill" data-bs-target="#tab-definitions" type="button" role="tab" aria-controls="tab-definitions" aria-selected="true"><span class="d-none d-sm-inline">Honey definitions</span><span class="d-sm-none">Definitions</span></button>
          <button class="nav-link" id="btn-purity" data-bs-toggle="pill" data-bs-target="#tab-purity" type="button" role="tab" aria-controls="tab-purity" aria-selected="false"><span class="d-none d-sm-inline">Why purity matters</span><span class="d-sm-none">Purity</span></button>
          <button class="nav-link" id="btn-deeper" data-bs-toggle="pill" data-bs-target="#tab-deeper" type="button" role="tab" aria-controls="tab-deeper" aria-selected="false">Go deeper</button>
        </div>
      </nav>
    </div>

    <div class="row g-4">
      <div class="col-12 tab-content">
        <!-- Honey definitions: tiles built from LEARN_TERMS in js/learn.js -->
        <section class="tab-pane fade show active" id="tab-definitions" role="tabpanel" aria-labelledby="btn-definitions" tabindex="0">
          <h2 class="learn-title">What does the label mean?</h2>
          <p class="text-soft mb-4">Tap a label to learn what it promises.</p>
          <div class="row g-3" id="termTiles"></div>
          <div class="term-detail is-empty mt-3" id="termDetail" aria-live="polite"></div>
        </section>

        <!-- Why purity matters: stat from PURITY_STAT in js/learn-sources.js -->
        <section class="tab-pane fade" id="tab-purity" role="tabpanel" aria-labelledby="btn-purity" tabindex="0">
          <h2 class="learn-title mb-4">Why purity matters</h2>
          <div class="purity-stat" id="purityStat"></div>

          <!-- Collapsed by default: more detail than the 22-word first view -->
          <div class="purity-process mt-3">
            <button class="purity-process__toggle collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#purityProcess" aria-expanded="false" aria-controls="purityProcess">
              Our process to ensure purity
              <i class="bi bi-chevron-down" aria-hidden="true"></i>
            </button>
            <div class="collapse" id="purityProcess">
              <ol class="purity-steps" id="puritySteps"></ol>
            </div>
          </div>
        </section>

        <!-- Go deeper: cards from LEARN_SOURCES in js/learn-sources.js -->
        <section class="tab-pane fade" id="tab-deeper" role="tabpanel" aria-labelledby="btn-deeper" tabindex="0">
          <h2 class="learn-title mb-4">Go deeper</h2>
          <div class="row g-3" id="sourceCards"></div>
        </section>
      </div>
    </div>
  </main>

  <div data-component="site-footer"></div>

  <!-- Shared navbar + footer first (local file, so they appear without waiting on the CDN) -->
  <script src="js/components.js"></script>
  <!-- Bootstrap JS (dropdowns, tabs, offcanvas, modals). Goes at the end of body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your JS -->
  <script src="js/main.js"></script>
  <script src="js/learn-sources.js"></script>
  <script src="js/learn.js"></script>
</body>
</html>
