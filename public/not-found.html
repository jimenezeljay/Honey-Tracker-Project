<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No data found · Honey Tracker</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Compiled CSS (already includes Bootstrap) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Navbar and footer are built by js/components.js (edit them there, once) -->
  <div data-component="site-nav"></div>

  <!-- Shown when a searched or scanned honey isn't in the system.
       The searched name fills the eyebrow line, e.g. not-found.html?q=Big+Name+Honey -->
  <main class="container empty-state">
    <i class="bi bi-question-diamond empty-icon d-block mb-3" aria-hidden="true"></i>
    <p class="eyebrow mb-2" id="searchedName" hidden></p>
    <h1 class="mb-3" id="punTitle">Well, that's un-bee-lievable.</h1>
    <p class="lead mb-4" id="punLead">We don't have the scoop on this honey yet.</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center">
      <a class="btn btn-primary" href="marketplace.html">Browse certified honey</a>
      <a class="btn btn-outline-secondary" href="map.html">Explore the map</a>
    </div>
  </main>
  <script>
    // Pick a random bee pun each visit. The HTML above is the fallback.
    const puns = [
      ["Well, that's un-bee-lievable.", "We don't have the scoop on this honey yet."],
      ["Buzz kill.", "This honey hasn't joined the hive yet."],
      ["Bee right back?", "We're still waiting on this keeper's buzz."]
    ];
    const [title, lead] = puns[Math.floor(Math.random() * puns.length)];
    document.getElementById('punTitle').textContent = title;
    document.getElementById('punLead').textContent = lead;

    // Show what the person searched for, e.g. "Big Name Honey?"
    const q = new URLSearchParams(location.search).get('q');
    if (q) {
      const el = document.getElementById('searchedName');
      el.textContent = q + '?';
      el.hidden = false;
    }
  </script>

  <div data-component="site-footer"></div>

  <!-- Shared navbar + footer first (local file, so they appear without waiting on the CDN) -->
  <script src="js/components.js"></script>
  <!-- Bootstrap JS (dropdowns, tabs, offcanvas, modals). Goes at the end of body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your JS -->
  <script src="js/main.js"></script>
</body>
</html>
