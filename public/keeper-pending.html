<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application status · Honey Tracker</title>
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Compiled CSS (already includes Bootstrap) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Navbar and footer are built by js/components.js (edit them there, once) -->
  <div data-component="site-nav" data-role="keeper"></div>

  <!-- Keeper application status (wireframe 12). New keepers wait here for admin approval;
       the hat icon and dashboard both lead here until then. js/keeper-pending.js updates this
       for other statuses; the HTML below is the under-review view. -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-7">
        <div class="panel text-center">
          <h1 class="h2 mb-4" id="applicationTitle">Application under review</h1>

          <ol class="stepper justify-content-center mb-4" id="applicationSteps">
            <li class="is-done">Submitted</li>
            <li class="is-current" aria-current="step">Under review</li>
            <li>Approved</li>
          </ol>

          <p class="lead text-soft mb-4" id="applicationMessage">We'll email you when your keeper account is approved. Browse honey while you wait.</p>

          <div class="d-flex flex-wrap gap-2 justify-content-center" id="applicationActions">
            <a class="btn btn-primary" href="map.html">Explore the map</a>
            <a class="btn btn-outline-secondary" href="marketplace.html">Browse the marketplace</a>
          </div>

          <!-- No application form exists yet to edit, so this goes nowhere for now -->
          <p class="mt-4 mb-0" id="applicationEdit"><a href="#">Edit my application</a></p>
        </div>
      </div>
    </div>
  </main>

  <div data-component="site-footer"></div>

  <!-- Shared navbar + footer first (local file, so they appear without waiting on the CDN) -->
  <script src="js/components.js"></script>
  <!-- Bootstrap JS (dropdowns, tabs, offcanvas, modals). Goes at the end of body -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Your JS -->
  <script src="js/main.js"></script>
  <script src="js/data.js"></script>
  <script src="js/keeper-pending.js"></script>
</body>
</html>
